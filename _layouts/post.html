---
layout: default
---
<article class="post">
  <h1>{{ page.title }}</h1>
  <p class="post-meta">{{ page.date | date: "%d %B %Y" }}{% if page.author %} &middot; {{ page.author }}{% endif %}</p>
  {% if page.image %}<img src="{{ page.image | relative_url }}" alt="{{ page.title }}" class="post-image">{% endif %}
  <div class="post-content">
    {{ content }}
  </div>
  <p><a href="{{ '/berita.html' | relative_url }}">&larr; Kembali ke Berita</a></p>
</article>
