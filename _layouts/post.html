---
layout: default
---
<section class="page-hero">
  <div class="page-hero-inner">
    <i class="bi bi-megaphone"></i>
    <h1>{{ page.title }}</h1>
  </div>
  {% include ridge.html %}
</section>

<article class="container page-body">
  <div class="page-body-inner">
    <div class="post-meta">
      <span><i class="bi bi-calendar3"></i> {{ page.date | date: "%d %B %Y" }}</span>
      {% if page.author %}<span><i class="bi bi-person"></i> {{ page.author }}</span>{% endif %}
    </div>

    {% if page.image %}
      <img class="post-hero-image" src="{{ page.image | relative_url }}" alt="{{ page.title }}">
    {% elsif page.bg_color %}
      <div class="post-hero-image" style="background: {{ page.bg_color }}; height: 300px; display: flex; align-items: center; justify-content: center; color: white; font-size: 3rem;"><i class="bi bi-newspaper"></i></div>
    {% endif %}

    <div class="post-body">
      {{ content }}
    </div>

    <a class="back-link" href="{{ '/berita' | relative_url }}">
      <i class="bi bi-arrow-left"></i> Kembali ke semua berita
    </a>
  </div>
</article>
