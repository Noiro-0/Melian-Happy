---
layout: default
---
<section class="page-hero">
  <div class="page-hero-inner">
    {% if page.icon %}<i class="bi {{ page.icon }}"></i>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.lede %}<p>{{ page.lede }}</p>{% endif %}
  </div>
</section>

<div class="container page-body">
  <div class="page-body-inner">
    {{ content }}
  </div>
</div>
