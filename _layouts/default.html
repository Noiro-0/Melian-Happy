<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% seo %}

  <link rel="icon" href="{{ '/admin/logo.jpg' | relative_url }}" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#386a20',
            'primary-container': '#b7f397',
            secondary: '#55624c',
            surface: '#fdfdf5',
            'surface-variant': '#dfe4d7',
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          },
          animation: {
            'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
          }
        },
      },
    };
  </script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const favImg = new Image();
      favImg.src = "{{ '/admin/logo.jpg' | relative_url }}";
      favImg.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.beginPath();
        ctx.arc(64, 64, 64, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(favImg, 0, 0, 128, 128);
        let link = document.querySelector("link[rel*='icon']") || document.createElement('link');
        link.type = 'image/png';
        link.rel = 'icon';
        link.href = canvas.toDataURL('image/png');
        document.head.appendChild(link);
      };
    });
  </script>
</head>

<body class="bg-light text-primary min-h-screen flex flex-col">
  {% include nav.html %}
  <main class="flex-1 container mx-auto p-6">
    {{ content }}
  </main>
  {% include footer.html %}

  <!-- Scroll Reveal Script -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add("opacity-100", "translate-y-0");
            entry.target.classList.remove("opacity-0", "translate-y-8");
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1, rootMargin: "0px 0px -50px 0px" });

      document.querySelectorAll(".reveal").forEach((el, index) => {
        el.classList.add("transition-all", "duration-1000", "ease-out", "opacity-0", "translate-y-8");
        if (el.dataset.delay) {
          el.style.transitionDelay = el.dataset.delay + 'ms';
        }
        observer.observe(el);
      });
    });
  </script>

  <!-- Penanganan gambar yang sudah dihapus dari Cloudinary -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      document.querySelectorAll("img").forEach(function(img) {
        img.addEventListener("error", function() {
          // Cari parent card/container terdekat dan sembunyikan seluruhnya
          var card = this.closest(".gallery-item, .news-card, .potensi-card, .post-gallery-item");
          if (card) {
            card.style.display = "none";
            return;
          }
          // Untuk hero image / gambar utama artikel, sembunyikan gambarnya saja
          this.style.display = "none";
        });
      });
    });
  </script>

  {% include lightbox.html %}
</body>

</html>
