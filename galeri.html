---
layout: page
icon: bi-images
title: Galeri
lede: Dokumentasi kegiatan dan keseharian warga Dusun Melian.
---
<div class="gallery-grid">
  {% for foto in site.data.galeri.galeri %}
  <figure class="gallery-item" onclick="openLightbox({{ forloop.index0 }})" style="cursor: pointer;">
    <div class="frame">
      <img src="{{ foto.gambar | relative_url }}" alt="{{ foto.judul }}" loading="lazy">
    </div>
    <figcaption>{{ foto.judul }}</figcaption>
  </figure>
  {% else %}
  <p>Belum ada foto galeri. Tambahkan lewat menu <strong>Galeri</strong> di CMS.</p>
  {% endfor %}
</div>

<!-- Lightbox Modal -->
<div id="lightboxModal" class="lightbox-modal" onclick="if(event.target === this) closeLightbox()">
  <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
  <span class="lightbox-prev" onclick="changeImage(-1, event)">&#10094;</span>
  <span class="lightbox-next" onclick="changeImage(1, event)">&#10095;</span>
  <img class="lightbox-content" id="lightboxImage" onclick="event.stopPropagation()">
  <div id="lightboxCaption"></div>
</div>

<script>
  var galleryItems = [
    {% for foto in site.data.galeri.galeri %}
      {
        src: "{{ foto.gambar | relative_url }}",
        caption: "{{ foto.judul | escape }}"
      }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];
  
  var currentIndex = 0;

  function openLightbox(index) {
    currentIndex = index;
    updateLightbox();
    
    var modal = document.getElementById('lightboxModal');
    modal.style.display = "flex";
    void modal.offsetWidth; // Trigger reflow
    modal.classList.add('show');
    document.body.style.overflow = 'hidden';
  }

  function updateLightbox() {
    var img = document.getElementById('lightboxImage');
    var cap = document.getElementById('lightboxCaption');
    
    if (galleryItems.length > 0) {
      img.src = galleryItems[currentIndex].src;
      cap.innerText = galleryItems[currentIndex].caption;
    }
  }

  function changeImage(step, event) {
    if (event) event.stopPropagation();
    currentIndex += step;
    if (currentIndex < 0) {
      currentIndex = galleryItems.length - 1;
    } else if (currentIndex >= galleryItems.length) {
      currentIndex = 0;
    }
    updateLightbox();
  }

  function closeLightbox() {
    var modal = document.getElementById('lightboxModal');
    modal.classList.remove('show');
    setTimeout(() => {
      modal.style.display = "none";
      document.body.style.overflow = 'auto';
    }, 300);
  }

  document.addEventListener('keydown', function(event) {
    if (document.getElementById('lightboxModal').style.display === "flex") {
      if (event.key === "Escape") closeLightbox();
      if (event.key === "ArrowLeft") changeImage(-1);
      if (event.key === "ArrowRight") changeImage(1);
    }
  });
</script>
