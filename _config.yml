title: "Dusun Sukamaju"
description: "Website Profil Resmi Dusun Sukamaju — Informasi, Berita, dan Potensi Dusun"
baseurl: ""
url: "https://Noiro-0.github.io"
repository: "Noiro-0/Melian-Happy"

# Identitas Dusun (edit sesuai kebutuhan lewat CMS: Pengaturan Umum)
dusun:
  nama: "Dusun Sukamaju"
  desa: "Desa Makmur"
  kecamatan: "Kecamatan Sejahtera"
  kabupaten: "Kabupaten Bahagia"
  provinsi: "Jawa Timur"
  kepala_dusun: "Bapak Suherman"
  alamat: "Jl. Raya Sukamaju No. 1"
  email: "dusunsukamaju@example.com"
  whatsapp: "081234567890"

collections:
  potensi:
    output: true
    permalink: /potensi/:path/

defaults:
  - scope:
      path: "_posts"
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: "_potensi"
      type: "potensi"
    values:
      layout: "potensi"

markdown: kramdown
permalink: /berita/:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
