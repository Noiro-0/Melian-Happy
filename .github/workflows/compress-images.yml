name: Compress Images

on:
  push:
    paths:
      - '**.jpg'
      - '**.jpeg'
      - '**.png'
      - '**.webp'
  pull_request:
    paths:
      - '**.jpg'
      - '**.jpeg'
      - '**.png'
      - '**.webp'

# Ensure only one image compression runs at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: calibreapp/image-actions
    runs-on: ubuntu-latest
    
    # Required permissions to commit changes back to the repository
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          # Fetch all history to ensure the action can compare changes
          fetch-depth: 0

      - name: Compress Images
        id: calibre
        uses: calibreapp/image-actions@main
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          # 80 is a great balance between high quality and small file size
          jpegQuality: "80"
          jpegProgressive: false
          pngQuality: "80"
          webpQuality: "80"
          ignorePaths: "node_modules/**,vendor/**,_site/**"
