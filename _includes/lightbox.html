<!-- Lightbox Modal -->
<div id="lightboxModal" class="lightbox-modal" onclick="if(event.target === this) closeLightbox()">
  <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
  <span class="lightbox-prev" onclick="changeImage(-1, event)">&#10094;</span>
  <span class="lightbox-next" onclick="changeImage(1, event)">&#10095;</span>
  <div id="lightboxContentContainer"></div>
  <div id="lightboxCaption"></div>
</div>

<script>
  var lightboxItems = [];
  var currentLightboxIndex = 0;

  function initLightbox() {
    // Kumpulkan semua gambar yang ingin bisa di-zoom
    var selectors = [
      '.gallery-item img',
      '.post-gallery-item img',
      'img.post-hero-image',
      'img.potensi-single-image',
      '.post-body img'
    ];
    
    var images = document.querySelectorAll(selectors.join(', '));
    
    images.forEach(function(img, index) {
      // Abaikan ikon atau thumbnail fallback/canvas
      if(img.classList.contains('pdf-thumbnail-canvas') || img.classList.contains('thumb') || img.closest('.pdf-attachment-card') || img.closest('a')) {
        // Jika gambar ada di dalam tag <a>, biarkan tag <a> yang bekerja (misal link ke file lain) kecuali kita ingin override
        if (!img.closest('.gallery-item') && !img.closest('.post-gallery-item')) {
           return;
        }
      }

      lightboxItems.push({
        type: 'image',
        src: img.src,
        caption: img.alt || img.getAttribute('data-caption') || ''
      });
      
      // Tambahkan cursor pointer
      img.style.cursor = 'pointer';
      
      // Override fungsi klik
      img.onclick = function(e) {
        e.preventDefault();
        e.stopPropagation();
        openLightbox(index);
      };
    });
  }

  function openLightbox(index) {
    if(lightboxItems.length === 0) return;
    currentLightboxIndex = index;
    updateLightbox();
    
    var modal = document.getElementById('lightboxModal');
    if(!modal) return;
    modal.style.display = "flex";
    void modal.offsetWidth; // Trigger reflow
    modal.classList.add('show');
    document.body.style.overflow = 'hidden';
  }

  function updateLightbox() {
    var container = document.getElementById('lightboxContentContainer');
    var cap = document.getElementById('lightboxCaption');
    if(!container || !cap) return;
    
    if (lightboxItems.length > 0) {
      var item = lightboxItems[currentLightboxIndex];
      container.innerHTML = '<img class="lightbox-content" src="' + item.src + '" onclick="event.stopPropagation()">';
      cap.innerText = item.caption;
    }
  }

  function changeImage(step, event) {
    if (event) event.stopPropagation();
    if(lightboxItems.length === 0) return;
    currentLightboxIndex += step;
    if (currentLightboxIndex < 0) {
      currentLightboxIndex = lightboxItems.length - 1;
    } else if (currentLightboxIndex >= lightboxItems.length) {
      currentLightboxIndex = 0;
    }
    updateLightbox();
  }

  function closeLightbox() {
    var modal = document.getElementById('lightboxModal');
    if(!modal) return;
    modal.classList.remove('show');
    setTimeout(() => {
      modal.style.display = "none";
      document.body.style.overflow = 'auto';
    }, 300);
  }

  document.addEventListener('keydown', function(event) {
    var modal = document.getElementById('lightboxModal');
    if (modal && modal.style.display === "flex") {
      if (event.key === "Escape") closeLightbox();
      if (event.key === "ArrowLeft") changeImage(-1);
      if (event.key === "ArrowRight") changeImage(1);
    }
  });

  // Inisialisasi setelah seluruh DOM dimuat
  document.addEventListener('DOMContentLoaded', initLightbox);
</script>
