<nav class="navbar" id="mainNav">
  <div class="navbar-inner">
    <a class="nav-brand" href="{{ '/' | relative_url }}">
      <img class="nav-logo" src="{{ '/admin/logo.svg' | relative_url }}" alt="Logo {{ site.dusun.nama }}">
      <span>
        {{ site.dusun.nama }}
        <small>Desa {{ site.dusun.desa }} &middot; {{ site.dusun.kabupaten }}</small>
      </span>
    </a>

    <button class="nav-toggle" id="navToggle" aria-label="Buka menu" aria-expanded="false" aria-controls="navLinks">
      <i class="bi bi-list"></i>
    </button>

    <div class="nav-links" id="navLinks">
      <a href="{{ '/' | relative_url }}" class="{% if page.url == '/' %}is-active{% endif %}">Beranda</a>
      <a href="{{ '/profil' | relative_url }}" class="{% if page.url == '/profil.html' %}is-active{% endif %}">Profil</a>
      <a href="{{ '/struktur' | relative_url }}" class="{% if page.url == '/struktur.html' %}is-active{% endif %}">Struktur</a>
      <a href="{{ '/statistik' | relative_url }}" class="{% if page.url == '/statistik.html' %}is-active{% endif %}">Statistik</a>
      <a href="{{ '/potensi' | relative_url }}" class="{% if page.url == '/potensi.html' %}is-active{% endif %}">Potensi</a>
      <a href="{{ '/galeri' | relative_url }}" class="{% if page.url == '/galeri.html' %}is-active{% endif %}">Galeri</a>
      <a href="{{ '/berita' | relative_url }}" class="{% if page.url == '/berita.html' %}is-active{% endif %}">Berita</a>
    </div>

    <a href="{{ '/kontak' | relative_url }}" class="nav-cta">
      <i class="bi bi-telephone-fill"></i> Kontak
    </a>
  </div>
</nav>

<script>
  (function () {
    var toggle = document.getElementById('navToggle');
    var links = document.getElementById('navLinks');
    if (!toggle || !links) return;
    toggle.addEventListener('click', function () {
      var isOpen = links.classList.toggle('is-open');
      toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      toggle.innerHTML = isOpen ? '<i class="bi bi-x-lg"></i>' : '<i class="bi bi-list"></i>';
    });

    // Navbar scroll effect
    var nav = document.getElementById('mainNav');
    window.addEventListener('scroll', function () {
      if (window.scrollY > 20) {
        nav.classList.add('scrolled');
      } else {
        nav.classList.remove('scrolled');
      }
    });
  })();
</script>
