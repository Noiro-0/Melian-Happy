<nav class="navbar" id="mainNav">
  <div class="navbar-inner">
    <a class="nav-brand" href="{{ '/' | relative_url }}">
      <img class="nav-logo" src="{{ '/assets/img/logo.jpg' | relative_url }}" alt="Logo {{ site.dusun.nama }}">
      <span>
        {{ site.dusun.nama }}
        <small>Desa {{ site.dusun.desa }} &middot; {{ site.dusun.kabupaten }}</small>
      </span>
    </a>

    <div class="nav-links" id="navLinks">
      <a href="{{ '/' | relative_url }}" class="{% if page.url == '/' or page.url == '/index.html' %}is-active{% endif %}">Beranda</a>
      <a href="{{ '/profil' | relative_url }}" class="{% if page.url contains '/profil' %}is-active{% endif %}">Profil</a>
      <a href="{{ '/struktur' | relative_url }}" class="{% if page.url contains '/struktur' %}is-active{% endif %}">Struktur</a>
      <a href="{{ '/statistik' | relative_url }}" class="{% if page.url contains '/statistik' %}is-active{% endif %}">Statistik</a>
      <a href="{{ '/potensi' | relative_url }}" class="{% if page.url contains '/potensi' %}is-active{% endif %}">Potensi</a>
      <a href="{{ '/galeri' | relative_url }}" class="{% if page.url contains '/galeri' %}is-active{% endif %}">Galeri</a>
      <a href="{{ '/berita' | relative_url }}" class="{% if page.url contains '/berita' %}is-active{% endif %}">Berita</a>
      <a href="{{ '/#kontak' | relative_url }}" class="{% if page.url contains '/#kontak' %}is-active{% endif %}">Kontak</a>
    </div>

    <a href="{{ '/admin' | relative_url }}" class="nav-cta">Login</a>
  </div>
</nav>

<script>
  (function () {
    // Navbar scroll effect
    var nav = document.getElementById('mainNav');
    if (!nav) return;
    window.addEventListener('scroll', function () {
      if (window.scrollY > 20) {
        nav.classList.add('scrolled');
      } else {
        nav.classList.remove('scrolled');
      }
    });
  })();
</script>
