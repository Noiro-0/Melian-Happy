# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: Noiro-0/Melian-Happy
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/c09574a3-5c7b-4cd3-aeae-11a231cd47a6/pkce
  auth_token_endpoint: /sites/c09574a3-5c7b-4cd3-aeae-11a231cd47a6/token
  gateway_url: https://gateway.decapbridge.com



# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Add site links in Decap CMS (optional)
site_url: https://melianhappy.vercel.app

logo_url: /assets/img/logo.jpg

media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"

collections:
  - name: "berita"
    label: "Berita"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Judul", name: "title", widget: "string" }
      - { label: "Tanggal", name: "date", widget: "datetime" }
      - { label: "Penulis", name: "author", widget: "string", default: "Admin Dusun" }
      - { label: "Kategori", name: "category", widget: "string", required: false }
      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
      - { label: "Gambar Sampul", name: "image", widget: "image", required: false }
      - label: "Warna Latar (Jika Tanpa Gambar)"
        name: "bg_color"
        widget: "select"
        options: 
          - label: "Hijau Gelap (Bawaan)"
            value: "var(--pine-dark)"
          - label: "Hijau Cemara"
            value: "var(--pine)"
          - label: "Kuning Emas"
            value: "var(--gold)"
          - label: "Merah Bata"
            value: "#a14036"
          - label: "Biru Tua"
            value: "#1e3a5f"
        default: "var(--pine-dark)"
        required: false
      - { label: "Dokumen PDF (Opsional)", name: "pdf_file", widget: "file", required: false, allow_multiple: false, choose_url: false }
      - { label: "Isi Berita", name: "body", widget: "markdown" }

  - name: "potensi"
    label: "Potensi Dusun"
    folder: "_potensi"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nama", name: "title", widget: "string" }
      - label: "Kategori"
        name: "kategori"
        widget: "select"
        options: ["UMKM", "Wisata", "Produk Unggulan", "Lainnya"]
      - { label: "Gambar", name: "image", widget: "image", required: false }
      - label: "Warna Latar (Jika Tanpa Gambar)"
        name: "bg_color"
        widget: "select"
        options: 
          - label: "Hijau Gelap (Bawaan)"
            value: "var(--pine-dark)"
          - label: "Hijau Cemara"
            value: "var(--pine)"
          - label: "Kuning Emas"
            value: "var(--gold)"
          - label: "Merah Bata"
            value: "#a14036"
          - label: "Biru Tua"
            value: "#1e3a5f"
        default: "var(--pine-dark)"
        required: false
      - { label: "Dokumen PDF (Opsional)", name: "pdf_file", widget: "file", required: false, allow_multiple: false, choose_url: false }
      - { label: "Deskripsi", name: "body", widget: "markdown" }

  - name: "profil"
    label: "Profil & Sejarah"
    files:
      - name: "profil"
        label: "Halaman Profil & Sejarah"
        file: "profil.html"
        fields:
          - { label: "Layout", name: "layout", widget: "hidden", default: "page" }
          - { label: "Icon", name: "icon", widget: "hidden", default: "bi-journal-bookmark" }
          - { label: "Judul Halaman", name: "title", widget: "string" }
          - { label: "Konten", name: "body", widget: "markdown" }

  - name: "beranda_data"
    label: "Pengaturan Beranda"
    files:
      - name: "slider"
        label: "Gambar Slider Beranda"
        file: "_data/slider.yml"
        fields:
          - label: "Daftar Gambar Slider"
            name: "slides"
            widget: "list"
            fields:
              - { label: "Gambar", name: "gambar", widget: "image" }
              - { label: "Judul (Opsional)", name: "judul", widget: "string", required: false }

  - name: "struktur_data"
    label: "Struktur Organisasi (Perangkat)"
    files:
      - name: "perangkat"
        label: "Daftar Perangkat Dusun"
        file: "_data/perangkat.yml"
        fields:
          - label: "Perangkat"
            name: "perangkat"
            widget: "list"
            fields:
              - { label: "Nama", name: "nama", widget: "string" }
              - { label: "Jabatan", name: "jabatan", widget: "string" }
              - { label: "Foto", name: "foto", widget: "image", required: false }

  - name: "statistik_data"
    label: "Statistik Kependudukan"
    files:
      - name: "statistik"
        label: "Data Statistik"
        file: "_data/statistik.yml"
        fields:
          - { label: "Tahun", name: "tahun", widget: "number" }
          - { label: "Jumlah KK", name: "jumlah_kk", widget: "number" }
          - { label: "Jumlah Penduduk", name: "jumlah_penduduk", widget: "number" }
          - { label: "Laki-laki", name: "laki_laki", widget: "number" }
          - { label: "Perempuan", name: "perempuan", widget: "number" }
          - label: "Mata Pencaharian"
            name: "mata_pencaharian"
            widget: "list"
            fields:
              - { label: "Jenis Pekerjaan", name: "label", widget: "string" }
              - { label: "Jumlah", name: "jumlah", widget: "number" }
          - label: "Kelompok Umur"
            name: "umur"
            widget: "list"
            fields:
              - { label: "Kategori Umur", name: "label", widget: "string" }
              - { label: "Jumlah", name: "jumlah", widget: "number" }

  - name: "galeri_data"
    label: "Galeri"
    files:
      - name: "galeri"
        label: "Daftar Foto Galeri"
        file: "_data/galeri.yml"
        fields:
          - label: "Foto"
            name: "galeri"
            widget: "list"
            fields:
              - { label: "Judul", name: "judul", widget: "string" }
              - { label: "Gambar", name: "gambar", widget: "image" }

  - name: "pengaturan"
    label: "Pengaturan Umum"
    files:
      - name: "config"
        label: "Identitas Dusun"
        file: "_config.yml"
        fields:
          - { label: "Judul Website", name: "title", widget: "string" }
          - { label: "Deskripsi", name: "description", widget: "string" }
          - label: "Identitas Dusun"
            name: "dusun"
            widget: "object"
            fields:
              - { label: "Nama Dusun", name: "nama", widget: "string" }
              - { label: "Desa", name: "desa", widget: "string" }
              - { label: "Kecamatan", name: "kecamatan", widget: "string" }
              - { label: "Kabupaten", name: "kabupaten", widget: "string" }
              - { label: "Provinsi", name: "provinsi", widget: "string" }
              - { label: "Nama Kepala Dusun", name: "kepala_dusun", widget: "string" }
              - { label: "Alamat", name: "alamat", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "WhatsApp", name: "whatsapp", widget: "string" }